<svg width="800" height="450" xmlns="http://www.w3.org/2000/svg">
  <!-- Background -->
  <defs>
    <radialGradient id="arenaBg" cx="50%" cy="50%">
      <stop offset="0%" style="stop-color:#1E2636;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#0A0D12;stop-opacity:1" />
    </radialGradient>
  </defs>

  <rect width="800" height="450" fill="url(#arenaBg)"/>
  <rect width="800" height="450" fill="none" stroke="#38BDF8" stroke-width="3"/>

  <!-- Title -->
  <text x="400" y="40" font-family="system-ui, sans-serif" font-size="28" font-weight="bold" fill="#EAB308" text-anchor="middle">
    Arceus Judgment Arena
  </text>

  <!-- Timer -->
  <g transform="translate(650, 20)">
    <rect width="120" height="50" rx="8" fill="#0E0F16" stroke="#EAB308" stroke-width="2"/>
    <text x="60" y="35" font-family="monospace" font-size="24" font-weight="bold" fill="#EAB308" text-anchor="middle">
      35:00
    </text>
  </g>

  <!-- Safe Zone (Center) -->
  <ellipse cx="400" cy="260" rx="140" ry="80" fill="rgba(110, 231, 183, 0.15)" stroke="#6EE7B7" stroke-width="3"/>
  <text x="400" y="250" font-family="system-ui, sans-serif" font-size="24" font-weight="bold" fill="#6EE7B7" text-anchor="middle">
    ✅ Safe Zone
  </text>
  <text x="400" y="275" font-family="system-ui, sans-serif" font-size="16" fill="#6EE7B7" text-anchor="middle">
    Keep Moving
  </text>

  <!-- Danger Zones -->
  <!-- Top Left -->
  <g transform="translate(120, 100)">
    <circle r="50" fill="rgba(239, 68, 68, 0.2)" stroke="#EF4444" stroke-width="2"/>
    <text y="8" font-size="32" text-anchor="middle">❌</text>
  </g>

  <!-- Top Right -->
  <g transform="translate(680, 100)">
    <circle r="50" fill="rgba(239, 68, 68, 0.2)" stroke="#EF4444" stroke-width="2"/>
    <text y="8" font-size="32" text-anchor="middle">❌</text>
  </g>

  <!-- Bottom Left -->
  <g transform="translate(180, 380)">
    <circle r="50" fill="rgba(239, 68, 68, 0.2)" stroke="#EF4444" stroke-width="2"/>
    <text y="8" font-size="32" text-anchor="middle">❌</text>
  </g>

  <!-- Bottom Right -->
  <g transform="translate(620, 380)">
    <circle r="50" fill="rgba(239, 68, 68, 0.2)" stroke="#EF4444" stroke-width="2"/>
    <text y="8" font-size="32" text-anchor="middle">❌</text>
  </g>

  <!-- Attack Indicator Lines -->
  <path d="M 120 100 L 280 200" stroke="#EF4444" stroke-width="2" stroke-dasharray="5,5" opacity="0.5"/>
  <path d="M 680 100 L 520 200" stroke="#EF4444" stroke-width="2" stroke-dasharray="5,5" opacity="0.5"/>
  <path d="M 180 380 L 300 320" stroke="#EF4444" stroke-width="2" stroke-dasharray="5,5" opacity="0.5"/>
  <path d="M 620 380 L 500 320" stroke="#EF4444" stroke-width="2" stroke-dasharray="5,5" opacity="0.5"/>

  <!-- Legend -->
  <g transform="translate(30, 60)">
    <rect width="180" height="70" rx="8" fill="rgba(14, 15, 22, 0.8)" stroke="#38BDF8" stroke-width="2"/>
    <circle cx="25" cy="25" r="8" fill="rgba(110, 231, 183, 0.3)" stroke="#6EE7B7" stroke-width="2"/>
    <text x="45" y="30" font-family="system-ui, sans-serif" font-size="14" fill="#E5E7EB">Safe Zone</text>
    <circle cx="25" cy="50" r="8" fill="rgba(239, 68, 68, 0.3)" stroke="#EF4444" stroke-width="2"/>
    <text x="45" y="55" font-family="system-ui, sans-serif" font-size="14" fill="#E5E7EB">Danger Zone</text>
  </g>
</svg>
