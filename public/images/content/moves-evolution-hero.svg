<svg width="1200" height="675" xmlns="http://www.w3.org/2000/svg">
  <!-- Background -->
  <rect width="1200" height="675" fill="#0A0D12"/>

  <!-- Title -->
  <text x="600" y="80" font-family="system-ui, sans-serif" font-size="48" font-weight="bold" fill="#38BDF8" text-anchor="middle">
    Move Evolution System
  </text>

  <!-- Base Move -->
  <g transform="translate(150, 250)">
    <rect width="220" height="160" rx="12" fill="url(#grad1)"/>
    <text x="110" y="85" font-family="system-ui, sans-serif" font-size="36" font-weight="bold" fill="white" text-anchor="middle">
      Ember
    </text>
    <text x="110" y="125" font-family="system-ui, sans-serif" font-size="18" fill="#E5E7EB" text-anchor="middle">
      Fire | Projectile
    </text>
  </g>

  <!-- Arrow 1 -->
  <path d="M 400 330 L 490 330" stroke="#38BDF8" stroke-width="4" fill="none" marker-end="url(#arrowhead)"/>
  <text x="445" y="315" font-family="system-ui, sans-serif" font-size="16" fill="#6EE7B7" text-anchor="middle">
    Level 5
  </text>

  <!-- Stat Card -->
  <g transform="translate(510, 280)">
    <rect width="160" height="100" rx="8" fill="#1E2636" stroke="#6EE7B7" stroke-width="3"/>
    <text x="80" y="45" font-family="system-ui, sans-serif" font-size="20" font-weight="bold" fill="#6EE7B7" text-anchor="middle">
      + Power
    </text>
    <text x="80" y="70" font-family="system-ui, sans-serif" font-size="14" fill="#9CA3AF" text-anchor="middle">
      Stat Card
    </text>
  </g>

  <!-- Arrow 2 -->
  <path d="M 700 330 L 790 330" stroke="#38BDF8" stroke-width="4" fill="none" marker-end="url(#arrowhead)"/>
  <text x="745" y="315" font-family="system-ui, sans-serif" font-size="16" fill="#EAB308" text-anchor="middle">
    Evolve
  </text>

  <!-- Evolved Move -->
  <g transform="translate(810, 250)">
    <rect width="240" height="160" rx="12" fill="url(#grad2)"/>
    <text x="30" y="40" font-size="32">✨</text>
    <text x="120" y="85" font-family="system-ui, sans-serif" font-size="36" font-weight="bold" fill="white" text-anchor="middle">
      Fire Blast
    </text>
    <text x="120" y="125" font-family="system-ui, sans-serif" font-size="18" fill="#E5E7EB" text-anchor="middle">
      Evolved | ×1.8 Damage
    </text>
  </g>

  <!-- Info Box -->
  <g transform="translate(200, 500)">
    <rect width="800" height="120" rx="8" fill="#161D2B" stroke="#38BDF8" stroke-width="2"/>
    <text x="400" y="40" font-family="system-ui, sans-serif" font-size="20" font-weight="bold" fill="#38BDF8" text-anchor="middle">
      How It Works
    </text>
    <text x="400" y="70" font-family="system-ui, sans-serif" font-size="16" fill="#E5E7EB" text-anchor="middle">
      1. Max out a move to level 5 by selecting its upgrade cards
    </text>
    <text x="400" y="95" font-family="system-ui, sans-serif" font-size="16" fill="#E5E7EB" text-anchor="middle">
      2. Draw the required stat card (Power, Vigor, Reflexes, etc.)
    </text>
  </g>

  <!-- Gradients -->
  <defs>
    <linearGradient id="grad1" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#F97316;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#DC2626;stop-opacity:1" />
    </linearGradient>
    <linearGradient id="grad2" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#EAB308;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#F59E0B;stop-opacity:1" />
    </linearGradient>
    <marker id="arrowhead" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto">
      <polygon points="0 0, 10 3, 0 6" fill="#38BDF8" />
    </marker>
  </defs>
</svg>
