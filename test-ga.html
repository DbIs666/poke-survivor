<!DOCTYPE html>
<html>
<head>
  <title>GA Test</title>
  <!-- Google tag (gtag.js) -->
  <script async src="https://www.googletagmanager.com/gtag/js?id=G-11NMJX9HWQ"></script>
  <script>
    window.dataLayer = window.dataLayer || [];
    function gtag(){dataLayer.push(arguments);}
    gtag('js', new Date());
    gtag('config', 'G-11NMJX9HWQ', {
      'debug_mode': true,
      'send_page_view': true
    });
    
    // 发送测试事件
    setTimeout(() => {
      gtag('event', 'test_event', {
        'event_category': 'test',
        'event_label': 'manual_test',
        'value': 1
      });
      console.log('✅ Test event sent');
    }, 2000);
  </script>
</head>
<body>

    Click to send event
  </button>
</body>
</html>
